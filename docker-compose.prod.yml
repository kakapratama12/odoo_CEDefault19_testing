# Production overrides - use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    restart: always
    ports: !reset []
    # PostgreSQL not exposed externally in production

  odoo:
    restart: always
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      - PROXY_MODE=True

  nginx:
    image: nginx:alpine
    container_name: odoo19-nginx
    restart: always
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/odoo.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
